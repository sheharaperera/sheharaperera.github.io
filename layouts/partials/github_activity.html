<div id="gh-activity" class="gh-activity" data-user="sheharaperera" aria-live="polite"></div>
<script>
(function () {
    var el = document.getElementById('gh-activity');
    var user = el.dataset.user;

    function build(data) {
        var days = data.contributions;
        var byDate = {};
        days.forEach(function (d) { byDate[d.date] = d; });

        var end = new Date(days[days.length - 1].date + 'T00:00:00');
        var start = new Date(end);
        start.setDate(start.getDate() - 6 - (52 * 7));
        start.setDate(start.getDate() - start.getDay());

        var weeks = [];
        var cur = new Date(start);
        while (cur <= end) {
            var week = [];
            for (var i = 0; i < 7; i++) {
                var iso = cur.toISOString().slice(0, 10);
                week.push(byDate[iso] || { date: iso, count: 0, level: 0 });
                cur.setDate(cur.getDate() + 1);
            }
            weeks.push(week);
        }

        var monthLabels = document.createElement('div');
        monthLabels.className = 'gh-months';
        var lastMonth = -1;
        weeks.forEach(function (week) {
            var m = new Date(week[0].date + 'T00:00:00').getMonth();
            var span = document.createElement('span');
            if (m !== lastMonth) {
                span.textContent = new Date(week[0].date + 'T00:00:00').toLocaleString('en', { month: 'short' });
                lastMonth = m;
            }
            monthLabels.appendChild(span);
        });

        var grid = document.createElement('div');
        grid.className = 'gh-grid';
        weeks.forEach(function (week) {
            var col = document.createElement('div');
            col.className = 'gh-week';
            week.forEach(function (d) {
                var cell = document.createElement('div');
                cell.className = 'gh-day gh-level-' + (new Date(d.date + 'T00:00:00') > end ? '' : d.level);
                cell.title = d.count + ' contribution' + (d.count === 1 ? '' : 's') + ' on ' + d.date;
                col.appendChild(cell);
            });
            grid.appendChild(col);
        });

        var total = days.reduce(function (s, d) { return s + d.count; }, 0);

        el.innerHTML = '';
        var scroll = document.createElement('div');
        scroll.className = 'gh-scroll';
        scroll.appendChild(monthLabels);
        scroll.appendChild(grid);
        el.appendChild(scroll);

        var footer = document.createElement('p');
        footer.className = 'gh-footer';
        footer.innerHTML = total + ' contributions in the last year &middot; <a href="https://github.com/' + user + '" target="_blank" rel="noopener noreferrer">@' + user + ' on GitHub</a>';
        el.appendChild(footer);
    }

    fetch('https://github-contributions-api.jogruber.de/v4/' + user + '?y=last')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(build)
        .catch(function () {
            el.innerHTML = '<p class="gh-footer">See my code on <a href="https://github.com/' + user + '" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>';
        });
})();
</script>
